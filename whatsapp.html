<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto Neugreen — WhatsApp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    max-width: 380px;
    width: 90%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
  }
  .logo-wrap { margin-bottom: 24px; }
  .logo-wrap img { height: 36px; }
  .wa-icon {
    width: 72px; height: 72px;
    background: #25D366;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .wa-icon svg { width: 40px; height: 40px; fill: #fff; }
  h2 {
    font-size: 20px;
    color: #0B1B2B;
    margin-bottom: 8px;
  }
  p {
    font-size: 14px;
    color: #5A6B82;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 16px 24px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
    transition: background 0.2s;
  }
  .btn:hover { background: #1ebe5d; }
  .note {
    margin-top: 16px;
    font-size: 12px;
    color: #aab4be;
  }
</style>
</head>
<body>
<div class="card">

  <div class="wa-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
  </div>

  <h2>Contactar a Neugreen</h2>
  <p>Te redirigimos a WhatsApp para que puedas hablar directamente con nuestro equipo.</p>

  <a class="btn" id="waBtn" href="#">
    Abrir WhatsApp
  </a>

  <p class="note">+52 444 256 5697 · neugreen.mx</p>
</div>

<script>
(function() {
  var phone   = "524442565697";
  var message = "Hola, solicito información de sus productos / servicios.";
  var encoded = encodeURIComponent(message);

  var isAndroid = /android/i.test(navigator.userAgent);
  var isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var isMobile  = isAndroid || isIOS;

  // Deep link para app nativa (móvil) o wa.me para escritorio
  var primaryLink = isMobile
    ? "whatsapp://send?phone=" + phone + "&text=" + encoded
    : "https://wa.me/" + phone + "?text=" + encoded;

  var fallbackLink = "https://wa.me/" + phone + "?text=" + encoded;

  // Asignar el href del botón manual siempre al fallback universal
  document.getElementById("waBtn").href = fallbackLink;

  // En móvil: intentar abrir la app directamente
  if (isMobile) {
    var start = Date.now();
    window.location.href = primaryLink;

    // Si pasaron más de 1.5s y el usuario sigue aquí → usar fallback web
    setTimeout(function() {
      if (Date.now() - start < 2000) {
        window.location.href = fallbackLink;
      }
    }, 1500);
  }
})();
</script>
</body>
</html>
