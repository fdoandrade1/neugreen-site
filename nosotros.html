<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nosotros — Neugreen México</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--ng-cloud); color: var(--ng-ink); font-family: var(--font-text); }
  ::selection { background: var(--ng-blue-100); color: var(--ng-blue-700); }
  button { font: inherit; }
  button:hover, a.btn-link:hover { filter: brightness(1.04); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="NosotrosHero.jsx"></script>
<script type="text/babel" src="NosotrosTimeline.jsx"></script>
<script type="text/babel" src="NosotrosValores.jsx"></script>
<script type="text/babel" src="CapacidadesPlanta.jsx"></script>
<script type="text/babel" src="NosotrosOrganigrama.jsx"></script>
<script type="text/babel" src="CTAStrip.jsx"></script>
<script type="text/babel" src="WhatsAppFloat.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const { useState } = React;
function App() {
  const [active, setActive] = useState('nosotros');
  const handleNav = (id) => {
    setActive(id);
    if (id === 'home') { window.location.href = 'index.html'; return; }
    if (id === 'productos') { window.location.href = 'productos.html'; return; }
    if (id === 'manufactura') { window.location.href = 'manufactura.html'; return; }
    if (id === 'industrial') { window.location.href = 'industrial.html'; return; }
    if (id === 'proyectos') { window.location.href = 'proyectos.html'; return; }
    if (id === 'contacto') { window.location.href = 'contacto.html'; return; }
    if (id === 'asesor' || id === 'cotizar') { window.location.href = 'contacto.html'; return; }
  };
  return (
    <div data-screen-label="Marketing site · nosotros">
      <Header onNavClick={handleNav} activeRoute={active} />
      <NosotrosHero />
      <NosotrosTimeline />
      <NosotrosValores />
      <CapacidadesPlanta />
      <NosotrosOrganigrama />
      <CTAStrip />
      <WhatsAppFloat />
      <Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
