<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neugreen México — Biotecnología en limpieza y desinfección</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--ng-cloud); color: var(--ng-ink); font-family: var(--font-text); }
  ::selection { background: var(--ng-blue-100); color: var(--ng-blue-700); }

  button { font: inherit; }
  button:hover, a.btn-link:hover { filter: brightness(1.04); }

  .ng-card-light:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--ng-blue-100) !important;
  }
  .ng-card-dark:hover {
    border-color: var(--ng-green) !important;
    box-shadow: 0 12px 30px -10px rgba(0,63,197,.5);
  }
  .ng-selector-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px -16px rgba(0,85,184,.30);
    border-color: var(--ng-blue) !important;
  }
  .ng-selector-card:hover .ng-arrow {
    background: var(--ng-blue) !important;
    color: #fff !important;
    transform: translateX(3px);
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script src="/assets/js/app.min.js"></script>
<script src="/assets/js/mount-index.js"></script>
</body>
</html>
